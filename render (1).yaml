# Криминальная империя — Telegram Mini App

Это отдельная рабочая версия проекта на основе предоставленного Python-кода. В комплекте:
- адаптивный интерфейс Mini App в тёмном/золотом стиле;
- FastAPI backend;
- проверка подписи Telegram `initData` на сервере;
- SQLite с игроками и имуществом;
- действия: покупка, улучшение, сбор дохода, ежедневная награда, задания;
- Telegram-бот: `/start` и кнопка открытия приложения, плюс меню «Открыть игру».

## Важно перед запуском

1. Не публикуй токен бота и не отправляй его никому.
2. Нужен публичный HTTPS-домен. Telegram Mini App в production должен открываться по HTTPS.
3. Запускай один экземпляр приложения/бота, потому что встроенный polling использует один поток получения обновлений.
4. Текущая версия сохраняет схему `players` и `assets` из исходника. Перед заменой старого `game.db` сделай резервную копию.

## Локальный запуск для проверки

Требуется Python 3.11+.

### Windows

```powershell
cd criminal_empire_miniapp
py -m venv .venv
.venv\Scripts\activate
pip install -r requirements.txt
copy .env.example .env
```

Открой `.env` и вставь:
- `BOT_TOKEN` — токен от @BotFather;
- `WEBAPP_URL` — публичный HTTPS адрес приложения (для локальной проверки можно сначала тестировать API/страницу в браузере, но Telegram не сможет открыть localhost на телефоне).

Запуск:

```powershell
uvicorn app:app --host 0.0.0.0 --port 8000
```

Проверка в браузере: `http://127.0.0.1:8000/`.
Без запуска внутри Telegram приложение намеренно не авторизует пользователя: сервер проверяет подписанный `initData`.

## Публикация в интернете

Подойдёт VPS с Ubuntu 22.04/24.04 или любой Python-хостинг с постоянным диском.

Пример на VPS:

```bash
sudo apt update
sudo apt install -y python3 python3-venv nginx
mkdir -p ~/criminal-empire
# Загрузи и распакуй проект в ~/criminal-empire
cd ~/criminal-empire
python3 -m venv .venv
source .venv/bin/activate
pip install -r requirements.txt
cp .env.example .env
nano .env
```

В `.env` укажи реальный токен и URL, например `https://game.example.com`.

Запусти тестово:

```bash
source .venv/bin/activate
uvicorn app:app --host 127.0.0.1 --port 8000
```

Настрой Nginx на проксирование домена на `127.0.0.1:8000`, затем выпусти SSL-сертификат Let's Encrypt (Certbot). После настройки HTTPS проверь, что `https://твой-домен/` открывается с телефона.

Для постоянной работы создай systemd unit (замени `YOUR_LINUX_USER` и путь):

```ini
[Unit]
Description=Criminal Empire Mini App
After=network.target

[Service]
User=YOUR_LINUX_USER
WorkingDirectory=/home/YOUR_LINUX_USER/criminal-empire
EnvironmentFile=/home/YOUR_LINUX_USER/criminal-empire/.env
ExecStart=/home/YOUR_LINUX_USER/criminal-empire/.venv/bin/uvicorn app:app --host 127.0.0.1 --port 8000
Restart=always
RestartSec=3

[Install]
WantedBy=multi-user.target
```

Сохрани как `/etc/systemd/system/criminal-empire.service`, затем:

```bash
sudo systemctl daemon-reload
sudo systemctl enable --now criminal-empire
sudo systemctl status criminal-empire
```

## Подключение к Telegram

1. Открой `@BotFather`.
2. Выбери своего бота и убедись, что он тот же, чей токен записан в `.env`.
3. Установи домен Mini App (если BotFather запросит настройку домена).
4. В `.env` задай `WEBAPP_URL` точным HTTPS URL.
5. Перезапусти приложение. При старте оно:
   - удалит старый webhook, чтобы polling не конфликтовал;
   - установит кнопку меню «Открыть игру» через `setChatMenuButton`;
   - начнёт получать `/start` и `/app`, отвечая кнопкой запуска Mini App.
6. Напиши боту `/start`, нажми «Открыть Криминальную империю» или кнопку меню.

Можно настроить меню вручную в `@BotFather` через `/setmenubutton`, указав текст и HTTPS URL.

## Перенос старой базы

Если у тебя уже есть `game.db`, останови старого бота и скопируй файл в каталог проекта. Сначала сделай копию:
```bash
cp game.db game-backup.db
```
Новая версия использует совместимые таблицы `players` и `assets`. Останови старый polling-бот перед переключением: старый процесс может конкурировать за обновления Telegram. Новая версия использует webhook.

## Что проверить после установки

- `/start` присылает кнопку открытия приложения.
- Внутри Telegram отображается имя пользователя.
- Покупка уменьшает баланс и добавляет объект в имущество.
- Улучшение списывает стоимость и сохраняет накопленный доход.
- Сбор дохода начисляет накопленную сумму.
- Ежедневная награда выдаётся не чаще раза в 24 часа.
- Повторное задание блокируется на период cooldown.
- Нельзя вызвать игровые действия без валидного Telegram `initData`.

## Ограничения этой первой версии

- Рейтинг пока показывает заглушку: для глобального рейтинга нужно добавить отдельный API-метод и экран со списком игроков.
- Команда, карта и полноценная система заданий/достижений ещё не реализованы — исходный код их игровой логики не содержал.
- В исходном каталоге ночной клуб стоит 120 000 ₽ и приносит 9 000 ₽/час; скриншот показывает другие цифры. Я сохранил цифры из твоего Python-кода, а не подменял экономику по картинке.
- В исходном коде стартовый баланс — 5 000 ₽. Скриншот показывает 125 000 ₽ как пример интерфейса, это не перенесено в новую экономику.
- Для реальной эксплуатации добавь резервное копирование БД, мониторинг, ограничение частоты запросов и HTTPS reverse proxy.


## Бесплатный Render — важные ограничения

- Free Web Service засыпает после 15 минут без входящих запросов; первый запуск после сна может занять около минуты.
- Локальная SQLite-база на бесплатном Render временная: данные пропадают после сна, перезапуска или нового деплоя. Используй этот режим только для проверки интерфейса и механик.
- Telegram webhook позволяет входящему `/start` разбудить спящий сервис, но первый ответ может задержаться на время запуска.
- Не используй бесплатный вариант как постоянный сервер для реальных игроков и ценных игровых данных.
